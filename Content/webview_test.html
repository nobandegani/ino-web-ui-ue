<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>InoWebUI — Bridge Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --fg: #e9ecf3;
    --fg-dim: #9ea6b5;
    --accent: #6ea8ff;
    --accent-hot: #89b9ff;
    --good: #4ade80;
    --bad: #ef4444;
    --panel-bg: rgba(18, 22, 32, 0.72);
    --panel-border: rgba(255, 255, 255, 0.08);
  }

  html, body {
    height: 100%;
    width: 100%;
    /* Transparent — the Unreal 3D scene shows through everywhere we don't paint. */
    background: transparent;
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 12px;
    grid-template-areas:
      "header header"
      "send   recv"
      "log    log";
  }

  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 14px;
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }

  #header { grid-area: header; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; }
  #send   { grid-area: send; display: flex; flex-direction: column; gap: 10px; }
  #recv   { grid-area: recv; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  #log    { grid-area: log; display: flex; flex-direction: column; gap: 8px; max-height: 180px; }

  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
  h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--fg-dim); margin-bottom: 4px; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--panel-border);
    font-size: 12px;
    color: var(--fg-dim);
  }
  .pill.on  { color: var(--good); border-color: rgba(74, 222, 128, 0.4); }
  .pill.off { color: var(--bad);  border-color: rgba(239, 68, 68, 0.4); }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .button-row { display: flex; flex-wrap: wrap; gap: 8px; }

  button {
    background: var(--accent); color: white; border: 0;
    padding: 8px 14px; border-radius: 8px;
    font: inherit; font-weight: 500; cursor: pointer;
    transition: background .1s, transform .05s;
    -webkit-user-select: none; user-select: none;
  }
  button:hover  { background: var(--accent-hot); }
  button:active { transform: scale(0.97); }
  button.ghost {
    background: rgba(255, 255, 255, 0.06); color: var(--fg);
    border: 1px solid var(--panel-border);
  }
  button.ghost:hover { background: rgba(255, 255, 255, 0.12); }

  input, textarea {
    width: 100%;
    background: rgba(0, 0, 0, 0.25);
    color: var(--fg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
    -webkit-user-select: text; user-select: text;
  }
  textarea { resize: none; min-height: 70px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }

  .rows { display: flex; flex-direction: column; gap: 6px; }

  #recv-list {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
    padding-right: 4px;
    -webkit-user-select: text; user-select: text;
  }
  .msg {
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
  }
  .msg .ch {
    display: inline-block;
    padding: 1px 7px;
    background: var(--accent);
    color: white;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    margin-right: 6px;
  }
  .msg pre {
    margin-top: 6px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--fg-dim);
    white-space: pre-wrap;
    word-break: break-word;
  }

  #log-list {
    flex: 1;
    overflow-y: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.6;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 12px;
    -webkit-user-select: text; user-select: text;
  }
  .log-line .ts  { color: var(--fg-dim); margin-right: 6px; }
  .log-line.out .arrow { color: var(--accent); font-weight: 700; }
  .log-line.in  .arrow { color: var(--good);   font-weight: 700; }
  .log-line.err .arrow { color: var(--bad);    font-weight: 700; }

  .hint { color: var(--fg-dim); font-size: 11px; }
  .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }

  ::-webkit-scrollbar        { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb  { background: rgba(255, 255, 255, 0.12); border-radius: 4px; }
  ::-webkit-scrollbar-track  { background: transparent; }
</style>
</head>
<body>

<div id="header" class="panel">
  <h1>InoWebUI — Bridge Test</h1>
  <div style="display: flex; gap: 8px; align-items: center;">
    <span id="bridge-pill" class="pill off"><span class="dot"></span><span id="bridge-text">No bridge</span></span>
    <span id="clock" class="pill"></span>
  </div>
</div>

<div id="send" class="panel">
  <h2>Send → UE</h2>

  <div class="button-row">
    <button onclick="send('ping', { t: Date.now() })">ping</button>
    <button onclick="send('hello', { text: 'Hi from the WebView!' })">hello</button>
    <button onclick="send('playerAction', { action: 'jump', at: Date.now() })">playerAction</button>
    <button class="ghost" onclick="send('pause', { })">pause</button>
    <button class="ghost" onclick="send('resume', { })">resume</button>
  </div>

  <div class="rows">
    <div>
      <h2 style="margin-top: 6px;">Custom</h2>
      <input id="custom-channel" placeholder="channel (e.g. 'myChannel')" value="myChannel" />
    </div>
    <textarea id="custom-payload" spellcheck="false">{
  "greeting": "hello UE",
  "count": 42,
  "tags": ["a", "b", "c"]
}</textarea>
    <div class="button-row">
      <button onclick="sendCustom()">Send custom JSON</button>
      <button class="ghost" onclick="formatCustom()">Pretty-print</button>
    </div>
    <p class="hint">Payload must be valid JSON. The object becomes the UE <code class="mono">Payload</code> JsonObject.</p>
  </div>
</div>

<div id="recv" class="panel">
  <h2>Received ← UE</h2>
  <div id="recv-list"></div>
  <div class="hint">
    UE calls <code class="mono">PostMessage(Channel, Payload)</code> from Blueprint/C++ — messages appear here.
  </div>
</div>

<div id="log" class="panel">
  <h2 style="display: flex; justify-content: space-between;">
    <span>Activity Log</span>
    <button class="ghost" onclick="clearLog()" style="padding: 2px 10px; font-size: 11px;">Clear</button>
  </h2>
  <div id="log-list"></div>
</div>

<script>
  // ───────── Bridge detection / helpers ─────────
  function detectBridge() {
    if (window.InoWebUI && typeof window.InoWebUI.send === 'function') return 'ready';
    if (window.chrome && window.chrome.webview)                       return 'raw';    // WebView2 but injection failed
    return null;
  }

  const pill     = document.getElementById('bridge-pill');
  const pillText = document.getElementById('bridge-text');
  function setBridgeUI(state) {
    if (state === 'ready') {
      pill.className = 'pill on';
      pillText.textContent = 'InoWebUI ready';
    } else if (state === 'raw') {
      pill.className = 'pill on';
      pillText.textContent = 'WebView2 (no InoWebUI shim)';
    } else {
      pill.className = 'pill off';
      pillText.textContent = 'Not running under Unreal';
    }
  }

  // ───────── Log helpers ─────────
  const logEl = document.getElementById('log-list');
  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function nowTs() {
    const d = new Date();
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) +
           '.' + String(d.getMilliseconds()).padStart(3, '0');
  }
  function log(kind, arrow, text) {
    const line = document.createElement('div');
    line.className = 'log-line ' + kind;
    line.innerHTML = '<span class="ts">[' + nowTs() + ']</span>' +
                     '<span class="arrow">' + arrow + '</span> ' +
                     escapeHtml(text);
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function clearLog() { logEl.innerHTML = ''; }

  // ───────── Send ─────────
  function send(channel, payload) {
    if (!window.InoWebUI) {
      log('err', '✗', 'InoWebUI bridge not available (open this HTML inside Unreal).');
      return;
    }
    try {
      window.InoWebUI.send(channel, payload);
      log('out', '→', channel + '  ' + JSON.stringify(payload));
    } catch (e) {
      log('err', '✗', 'send failed: ' + e.message);
    }
  }

  function sendCustom() {
    const channel = (document.getElementById('custom-channel').value || '').trim();
    const raw     = document.getElementById('custom-payload').value;
    if (!channel) { log('err', '✗', 'channel is empty'); return; }
    let payload;
    try { payload = JSON.parse(raw); }
    catch (e) { log('err', '✗', 'payload is not valid JSON: ' + e.message); return; }
    send(channel, payload);
  }

  function formatCustom() {
    const ta = document.getElementById('custom-payload');
    try { ta.value = JSON.stringify(JSON.parse(ta.value), null, 2); }
    catch (e) { log('err', '✗', 'cannot pretty-print — invalid JSON'); }
  }

  // ───────── Receive ─────────
  const recvList = document.getElementById('recv-list');
  const MAX_RECV = 25;

  function showReceived(channel, payload) {
    const el = document.createElement('div');
    el.className = 'msg';
    el.innerHTML = '<span class="ch">' + escapeHtml(channel) + '</span>' +
                   '<span class="hint">' + nowTs() + '</span>' +
                   '<pre>' + escapeHtml(JSON.stringify(payload, null, 2)) + '</pre>';
    recvList.insertBefore(el, recvList.firstChild);
    while (recvList.children.length > MAX_RECV) recvList.removeChild(recvList.lastChild);
  }

  // ───────── Init ─────────
  function init() {
    const state = detectBridge();
    setBridgeUI(state);

    if (state === 'ready') {
      // Catch-all listener: every channel we know the test UE side sends,
      // plus any custom ones the user wires up.
      ['ping', 'pong', 'hello', 'helloReply', 'tick', 'playerState',
       'healthChanged', 'agentSaid', 'toast', 'echo']
        .forEach(function(ch) {
          window.InoWebUI.on(ch, function(payload) {
            showReceived(ch, payload);
            log('in', '←', ch + '  ' + JSON.stringify(payload));
          });
        });

      log('out', 'ℹ', 'InoWebUI bridge ready. Click a button above to send a test message.');
    } else if (state === 'raw') {
      log('err', 'ℹ', 'chrome.webview is present but InoWebUI shim did not inject.');
    } else {
      log('err', 'ℹ', 'Running in a plain browser — buttons will error. Open under Unreal.');
    }

    // Clock
    const clock = document.getElementById('clock');
    function tick() { clock.textContent = nowTs(); }
    tick(); setInterval(tick, 1000);
  }

  init();
</script>

</body>
</html>
